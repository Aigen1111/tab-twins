<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tab Twins</title>
  <link rel="stylesheet" href="../ui/base.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="popup-head">
    <input id="search" type="search" placeholder="Buscar en tus pestañas abiertas…" autocomplete="off" autofocus>
  </header>

  <section id="current" hidden></section>
  <section id="summary"></section>
  <ul id="results" class="list" role="listbox"></ul>

  <footer class="popup-foot">
    <button id="open-manager" class="btn primary">Revisar duplicados</button>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
